# Publish frontend/ to GitHub Pages on every push to main.
# The site is static: scenarios, example questions, research map, flame map and
# method page all come from frontend/data/demo.js. Live AI answers need
# frontend/serve.py + Ollama and are not part of the public site.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Collect the static site
        # Only the files the browser needs; the Python build/serve scripts stay out.
        run: |
          mkdir -p _site/data
          cp frontend/index.html frontend/app.js frontend/style.css _site/
          cp frontend/data/demo.js _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true   # keep .nojekyll (v5 drops dotfiles by default)
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Check the live site
        # Fails the run if the published page does not load or lost its data file.
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$url?run=${{ github.run_id }}" | grep -q 'data/demo.js' &&
               curl -fsS -o /dev/null "${url}data/demo.js?run=${{ github.run_id }}"; then
              echo "Live site OK: $url"; exit 0
            fi
            sleep 10
          done
          echo "Live site check failed: $url"; exit 1
