# Publish frontend/ to GitHub Pages on every push to main.
# The site is static: scenarios, example questions, research map, flame map and
# method page all come from frontend/data/demo.js. Live AI answers need
# frontend/serve.py + Ollama and are not part of the public site.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the static site
        # Only the files the browser needs; the Python build/serve scripts stay out.
        run: |
          mkdir -p _site/data
          cp frontend/index.html frontend/app.js frontend/style.css _site/
          cp frontend/data/demo.js _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
